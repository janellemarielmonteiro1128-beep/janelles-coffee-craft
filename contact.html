<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Janelle's Coffee Craft - Contact</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Body & Page Colors */
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f3ef;
      color: #333333;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    /* Navigation Links */
    nav a {
      color: #ffffff !important;
      font-weight: bold;
      text-decoration: none;
      margin: 0 10px;
    }

    nav a:hover {
      color: #d4c3b3 !important;
    }

    /* Form Card Container */
    form {
      max-width: 450px;
      margin: 25px auto;
      text-align: left;
    }

    fieldset {
      background-color: #ffffff;
      border: 2px solid #d7c4b7;
      border-radius: 10px;
      padding: 20px 25px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    legend {
      font-weight: bold;
      color: #4a2c2a;
      padding: 0 8px;
      font-size: 1.1rem;
    }

    /* Input Fields & Dropdown */
    input[type="text"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      background-color: #fafafa;
    }

    /* Field Focus */
    input:focus,
    select:focus,
    textarea:focus {
      border-color: #4a2c2a;
      outline: none;
      background-color: #ffffff;
    }

    /* Submit Button */
    button[type="submit"] {
      width: 100%;
      background-color: #4a2c2a;
      color: #ffffff;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button[type="submit"]:hover {
      background-color: #6b3e3b;
    }
  </style>
</head>
<body>

  <header>
    <h1 style="color: #ffffff;">Janelle's Coffee Craft</h1>
    <nav style="color: #ffffff;">
      <a href="index.html" style="color: #ffffff;">Home</a> |
      <a href="about.html" style="color: #ffffff;">About</a> |
      <a href="contact.html" style="color: #ffffff;">Contact</a>
    </nav>
  </header>

  <main>
    <img src="contact-banner.jpg" alt="Anime coffee bean grinder aesthetic banner" width="450" style="height: auto; border-radius: 8px; margin-top: 15px;">

    <h2>How to contact us!</h2>

    <p><strong>Email:</strong> support@janellescoffeecraft.com</p>
    <p><strong>Phone:</strong> +63 912 345 6789</p>
    <p><strong>Address:</strong> Sampaloc, Manila, Philippines</p>

    <form action="contact.html" method="get">
      <fieldset>
        <legend>Your details</legend>

        <label for="user-name">Name:</label>
        <input type="text" id="user-name" name="user-name" required>

        <label for="user-email">Email:</label>
        <input type="email" id="user-email" name="user-email" required>

        <label for="subject">Subject:</label>
        <select id="subject" name="subject">
          <option value="product-question">Product Question</option>
          <option value="order-status">Order Status</option>
          <option value="wholesale-inquiry">Wholesale Enquiry</option>
          <option value="something-else">Something Else</option>
        </select>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send message</button>
      </fieldset>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Janelle's Coffee Craft. All rights reserved.</p>
  </footer>

</body>
</html>
